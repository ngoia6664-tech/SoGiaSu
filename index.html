<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ gia sư</title>
<meta name="theme-color" content="#4A3BCB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ gia sư">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1FA; --card:#FFFFFF; --ink:#1B1938; --muted:#74728F; --line:#E4E2F3;
  --brand:#5B47E0; --brand-soft:#ECE9FF; --on-brand:#FFFFFF;
  --ok:#12936A; --ok-soft:#DDF5EC; --warn:#B96D00; --warn-soft:#FFF0D6; --bad:#D6403A; --bad-soft:#FFE4E1;
  --hero:linear-gradient(150deg,#4A3BCB 0%,#6F4FE8 55%,#9B5DE5 100%);
  --hero-shadow:0 16px 32px -14px rgba(91,71,224,.6);
  --sh1:0 1px 2px rgba(27,25,56,.06);
  --sh2:0 12px 32px -14px rgba(27,25,56,.28);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.5,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D1B; --card:#181730; --ink:#EDEBFF; --muted:#9A98BC; --line:#2B2A4A;
    --brand:#9A8CFF; --brand-soft:#26224D; --on-brand:#14102E;
    --ok:#4ADBA6; --ok-soft:#10352B; --warn:#FFC25E; --warn-soft:#3B2C10; --bad:#FF8279; --bad-soft:#40201F;
    --hero:linear-gradient(150deg,#2A2370 0%,#4A34A8 60%,#6B3FA8 100%);
    --hero-shadow:0 16px 32px -14px rgba(0,0,0,.7);
    --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 12px 32px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D1B; --card:#181730; --ink:#EDEBFF; --muted:#9A98BC; --line:#2B2A4A;
  --brand:#9A8CFF; --brand-soft:#26224D; --on-brand:#14102E;
  --ok:#4ADBA6; --ok-soft:#10352B; --warn:#FFC25E; --warn-soft:#3B2C10; --bad:#FF8279; --bad-soft:#40201F;
  --hero:linear-gradient(150deg,#2A2370 0%,#4A34A8 60%,#6B3FA8 100%);
  --hero-shadow:0 16px 32px -14px rgba(0,0,0,.7);
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 12px 32px -12px rgba(0,0,0,.6);
}
/* animatable progress value used by bars and rings */
@property --v{syntax:'<number>';inherits:true;initial-value:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s var(--ease),background-color .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease}
button:active{transform:scale(.96)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sticky glass header */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;margin:calc(-1 * env(safe-area-inset-top,0px)) -14px 10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--bg);background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s ease}
body.scrolled .top{border-bottom-color:var(--line)}
.top h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;box-shadow:var(--sh1)}
.ibtn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ibtn.icon{width:40px;height:40px;padding:0}
@media (hover:hover){
  .ibtn:hover{border-color:var(--brand)}
  .ibtn.primary:hover{filter:brightness(1.08)}
}

/* segmented control with sliding thumb */
.seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;flex:none}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--card);border-radius:9px;box-shadow:var(--sh1)}
.seg.r::before{transform:translateX(100%)}
.seg.just.r::before{animation:segR .35s var(--spring)}
.seg.just:not(.r)::before{animation:segL .35s var(--spring)}
@keyframes segR{from{transform:translateX(0)}}
@keyframes segL{from{transform:translateX(100%)}}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:9px}
.seg button[aria-pressed="true"]{color:var(--ink)}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nav .lb{flex:1;text-align:center;font-weight:700;font-size:16px}
.nav .lb small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav .lb a{color:var(--brand);text-decoration:none;font-weight:600}
.nav .ibtn{width:40px;height:40px;padding:0}
.strip{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);justify-content:center;margin-bottom:4px}
.strip b{color:var(--ink);font-weight:600}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.prog i{display:block;height:100%;width:calc(var(--v)*1%);border-radius:inherit;background:var(--bc,var(--ok));transition:--v .7s var(--ease)}
.prog.sm{flex:1;min-width:28px;max-width:90px;height:5px;margin:0}

.day{margin-top:16px}
.dh{display:flex;align-items:center;gap:8px;padding:0 2px}
.dh b{font-size:15px}
.dh span.d{color:var(--muted);font-size:13px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.day.today .dh b{color:var(--brand)}
.none{color:var(--muted);font-size:13px;padding:6px 2px 0}

.ses{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,var(--ct),var(--card) 60%);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:11px 11px 11px 12px;margin-top:8px;cursor:pointer;box-shadow:var(--sh1);transition:transform .2s var(--ease),box-shadow .2s ease}
.ses .mid{flex:1;min-width:0}
.ses .cn{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ses .tm{font-size:13.5px;color:var(--muted)}
.ses .nt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ses.off{opacity:.55}
.ses.off .cn span.nm{text-decoration:line-through}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.off{background:var(--line);color:var(--muted)}
.tick{position:relative;flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--c);background:none;display:grid;place-items:center;color:transparent;font-size:18px;font-weight:700}
.tick.on{background:var(--c);color:#fff}
.tick.pop{animation:pop .4s var(--spring)}
.tick.pop::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c);animation:burst .55s ease-out forwards}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes burst{to{transform:scale(1.8);opacity:0}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;box-shadow:var(--sh1);transition:transform .2s var(--ease),box-shadow .2s ease}
.card.ccard{display:flex;align-items:center;gap:6px;padding:12px 10px 12px 14px}
.crow{display:flex;gap:12px;align-items:center;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit}
button.crow{cursor:pointer}
.dotc{flex:none;width:14px;height:44px;border-radius:7px}
.crow .mid{flex:1;min-width:0}
.crow .nm{display:block;font-weight:700}
.crow .sb{display:block;font-size:13px;color:var(--muted)}
.crow .pr{font-weight:700;text-align:right;white-space:nowrap}
.cm{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
@media (hover:hover){
  .ses:hover,.card.ccard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
}

.sum{--paid:#7CF2C0;--unpaid:#FFC95E;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%),var(--hero);
  color:#fff;border-radius:22px;padding:18px;box-shadow:var(--hero-shadow)}
.sum .lbl{color:rgba(255,255,255,.78);font-size:13px}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0}
.flow{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.2);margin:14px 0 8px}
.flow i{display:block;height:100%}
.flow.grow i{animation:grow .8s var(--ease)}
@keyframes grow{from{width:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:rgba(255,255,255,.8)}
.legend b{color:#fff;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mini{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 12px}
.mini .v{font-weight:700;font-size:16px;color:#fff}
.mini .lbl{font-size:12px}
.note{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:13.5px;background:rgba(255,255,255,.14);color:#fff;border-left:4px solid #FFC95E}
.stat{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--line);color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font-weight:600;font-size:13px;padding:4px 0;margin-left:auto}

/* month summary */
.msum{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh1);margin:4px 0 6px}
.ring{position:relative;flex:none;width:76px;height:76px;display:grid;place-content:center;text-align:center;line-height:1.1;transition:--v .8s var(--ease)}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--rc,var(--ok)) calc(var(--v)*1%),var(--line) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px))}
.ring b{font-size:17px}
.ring small{font-size:11px;color:var(--muted)}
.msum .lbl{font-size:12.5px;color:var(--muted)}
.msum .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.msum .sb{font-size:13px;color:var(--muted)}
.msum .sb b{color:var(--ink);font-weight:600}

/* month calendar */
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:8px}
.wd{font-size:12px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cell{position:relative;min-height:60px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--ink);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.cell.nil{background:transparent;border-color:transparent;color:var(--muted);font-weight:500;box-shadow:none}
.cell .d{min-width:24px;border-radius:8px;line-height:22px}
.cell.today .d{background:var(--brand);color:var(--on-brand)}
.cell small{font-size:10.5px;font-weight:600;line-height:1}
.cell .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:0 2px}
.cell .dots i{width:8px;height:8px;border-radius:50%;border:2px solid var(--c)}
.cell .dots i.on{background:var(--c)}
.cell .dots i.off{border-color:var(--muted);opacity:.5}
.cell.s-plan{border:2px solid color-mix(in srgb,var(--c) 55%,transparent)}
.cell.s-plan small{color:var(--muted)}
.cell.s-done{background:var(--c);border-color:var(--c);color:#fff}
.cell.s-done.today .d{background:#fff;color:var(--c)}
.cell.s-off{color:var(--muted);opacity:.7}
.cell.s-off .d{text-decoration:line-through}
.cell .x{position:absolute;top:-6px;right:-4px;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.cell.pressing{transform:scale(.88);transition:transform .48s var(--ease)}
.cell.pop{animation:pop .45s var(--spring)}
@media (hover:hover){ .cell:not(.nil):hover{border-color:var(--brand)} .cell.nil:hover{background:var(--card)} }
.legend2{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.legend2 button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.legend2 i{width:8px;height:8px;border-radius:50%}
.hint2{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 0 0}

/* floating glass tab bar */
.tabs{position:fixed;z-index:20;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(400px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:20px;background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);box-shadow:var(--sh2)}
.tabs .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 3);border-radius:15px;background:var(--brand-soft);transform:translateX(calc(var(--idx,0) * 100%));transition:transform .45s var(--spring)}
.tb{position:relative;z-index:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:7px 0;border-radius:15px}
.tb.on{color:var(--brand)}
.tb.on svg{animation:bounce .5s var(--spring)}
@keyframes bounce{40%{transform:translateY(-3px) scale(1.12)}}

/* sheets */
.ov{position:fixed;inset:0;background:rgba(14,10,40,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .25s ease}
.ov.out{animation:fadeOut .2s ease forwards;pointer-events:none}
.sheet{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;outline:none;box-shadow:0 -10px 40px -12px rgba(0,0,0,.35);animation:sheetUp .4s var(--spring)}
.ov.out .sheet{animation:sheetDown .2s ease forwards}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
.sheet h2{margin:0 0 12px;font-size:17px}
.sheet .ses:first-child{margin-top:0}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input[type=text],.fld input[type=date],.fld input[type=time],.fld textarea,.fld select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-height:46px;transition:border-color .2s ease,box-shadow .2s ease}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fld textarea{min-height:110px;font-family:inherit}
.fld textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:140px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.fld.cb{display:flex;gap:10px;align-items:flex-start}
.fld.cb label{margin:0;color:var(--ink);font-size:14.5px}
.fld.cb input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--brand)}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btns .save{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btns .del{color:var(--bad);flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}
.sw button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.days{display:flex;gap:6px}
.dchip{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px}
.dchip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.trow{display:flex;align-items:center;gap:8px;margin-top:10px}
.trow .dn{width:76px;font-size:13.5px;font-weight:600;flex:none}
.trow input{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:500;z-index:60;box-shadow:var(--sh2);white-space:nowrap;animation:toastIn .35s var(--spring)}
.toast.out{animation:toastOut .2s ease forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,8px)}}

/* view transitions: fade-up stagger on tab change, slide on prev/next */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes inL{from{opacity:0;transform:translateX(28px)}}
@keyframes inR{from{opacity:0;transform:translateX(-28px)}}
@keyframes cellIn{from{opacity:0;transform:scale(.8)}}
.m-fade > :not(.top){animation:rise .45s var(--ease) both;animation-delay:calc(min(var(--i,0),10) * 40ms)}
.m-left > :not(.top){animation:inL .35s var(--ease) both}
.m-right > :not(.top){animation:inR .35s var(--ease) both}
.m-fade .cell,.m-left .cell,.m-right .cell{animation:cellIn .4s var(--ease) both;animation-delay:calc(var(--j,0) * 9ms)}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:359px){
  .top h1{font-size:19px}
  .seg button{padding:6px 8px}
}
@media (min-width:768px){
  .wrap{max-width:720px;padding:0 24px 130px}
  .top{margin-left:-24px;margin-right:-24px;padding-left:24px;padding-right:24px}
  .top h1{font-size:26px}
  .cell{min-height:84px;font-size:15px}
  .cell .dots i{width:10px;height:10px}
  .ov{align-items:center}
  .sheet{max-width:480px;border-radius:24px;max-height:86%;animation:dlgIn .32s var(--spring)}
  .ov.out .sheet{animation:dlgOut .18s ease forwards}
  .grab{display:none}
  @keyframes dlgIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
  @keyframes dlgOut{to{opacity:0;transform:scale(.97)}}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

6-10-09\":{\"status\":\"planned\",\"start\":\"19:30\",\"end\":\"21:30\",\"paid\":false},\"si8ly1kp9i|2026-10-10\":{\"status\":\"planned\",\"start\":\"08:00\",\"end\":\"10:00\",\"paid\":false},\"7dhdify7n2|2026-10-10\":{\"status\":\"planned\",\"start\":\"14:30\",\"end\":\"16:30\",\"paid\":false},\"tftncdvocq|2026-10-10\":{\"status\":\"planned\",\"start\":\"16:45\",\"end\":\"18:45\",\"paid\":false},\"si8ly1kp9i|2026-10-11\":{\"status\":\"planned\",\"start\":\"08:00\",\"end\":\"10:00\",\"paid\":false},\"7dhdify7n2|2026-10-11\":{\"status\":\"planned\",\"start\":\"14:30\",\"end\":\"16:30\",\"paid\":false},\"tftncdvocq|2026-10-11\":{\"status\":\"planned\",\"start\":\"16:45\",\"end\":\"18:45\",\"paid\":false},\"x|6bt5tok5kd\":{\"extra\":true,\"classId\":\"6062ci05ea\",\"date\":\"2026-10-02\",\"start\":\"15:00\",\"end\":\"17:00\",\"status\":\"done\",\"paid\":false,\"price\":250000},\"x|pex8iqsves\":{\"extra\":true,\"classId\":\"7dhdify7n2\",\"date\":\"2026-10-03\",\"start\":\"14:30\",\"end\":\"16:30\",\"status\":\"done\",\"paid\":false,\"price\":300000},\"x|o13gsblfs1\":{\"extra\":true,\"classId\":\"7dhdify7n2\",\"date\":\"2026-10-04\",\"start\":\"19:00\",\"end\":\"20:30\",\"status\":\"done\",\"paid\":false,\"price\":300000},\"x|siykzk0c09\":{\"extra\":true,\"classId\":\"tftncdvocq\",\"date\":\"2026-10-03\",\"start\":\"17:00\",\"end\":\"19:00\",\"status\":\"done\",\"paid\":false,\"price\":250000},\"x|g6kyqmptqc\":{\"extra\":true,\"classId\":\"tftncdvocq\",\"date\":\"2026-10-04\",\"start\":\"17:00\",\"end\":\"19:00\",\"status\":\"done\",\"paid\":false,\"price\":250000},\"x|we76fkuyrz\":{\"extra\":true,\"classId\":\"si8ly1kp9i\",\"date\":\"2026-10-03\",\"start\":\"08:00\",\"end\":\"10:00\",\"status\":\"done\",\"price\":250000},\"x|e5r93h0jms\":{\"extra\":true,\"classId\":\"si8ly1kp9i\",\"date\":\"2026-10-04\",\"start\":\"08:00\",\"end\":\"10:00\",\"status\":\"done\",\"price\":250000},\"x|1r9edha838\":{\"extra\":true,\"classId\":\"rv9fn7pr45\",\"date\":\"2026-10-02\",\"start\":\"19:00\",\"end\":\"21:00\",\"status\":\"done\",\"price\":200000}}}";
(function(){

/* ---------- helpers ---------- */
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(n){ n = Math.round(n || 0); var neg = n < 0; var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '-' : '') + s + 'đ'; }
function parseMoney(v){
  var s = String(v || '').toLowerCase().replace(/\s+/g, '').replace(/đ|vnd|d$/g, '');
  if (!s) return 0;
  var m = s.match(/^([\d.,]+)(k|tr|m|nghin|ngan|trieu)?$/);
  if (!m) return NaN;
  if (m[2]) {
    var num = parseFloat(m[1].replace(',', '.'));
    if (isNaN(num)) return NaN;
    return Math.round(num * ((m[2] === 'k' || m[2] === 'nghin' || m[2] === 'ngan') ? 1000 : 1000000));
  }
  return parseInt(m[1].replace(/[.,]/g, ''), 10) || 0;
}
function pad(n){ return String(n).padStart(2, '0'); }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pdate(s){ var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
function mondayOf(d){ return addDays(d, -((d.getDay() + 6) % 7)); }
function monthKey(d){ return dstr(d).slice(0, 7); }
function shiftMonth(k, n){ var p = k.split('-'); return monthKey(new Date(+p[0], +p[1] - 1 + n, 1)); }
function dm(ds){ var d = pdate(ds); return d.getDate() + '/' + (d.getMonth() + 1); }
function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }
function mins(t){ var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
function durText(a, b){
  var m = mins(b) - mins(a); if (m <= 0) return '';
  var h = Math.floor(m / 60), r = m % 60;
  return h ? (h + 'g' + (r ? pad(r) : '')) : (r + 'p');
}
function monthLabel(k){ var p = k.split('-'); return 'Tháng ' + parseInt(p[1], 10) + '/' + p[0]; }
function clsById(id){ for (var i = 0; i < S.classes.length; i++) if (S.classes[i].id === id) return S.classes[i]; return null; }
function slotsText(c){
  var out = [];
  ORDER.forEach(function(d){ var sl = c.slots && c.slots[d]; if (sl) out.push(DOWN[d] + ' ' + sl.start + '–' + sl.end); });
  return out.length ? out.join(' · ') : 'Chưa có lịch cố định';
}
function each(sel, root, fn){ Array.prototype.forEach.call((root || document).querySelectorAll(sel), fn); }

/* ---------- sessions ---------- */
function build(key, c, ds, sl, r){
  var st = r.status || 'planned';
  return { key: key, cid: c.id, date: ds, start: r.start || sl.start, end: r.end || sl.end, status: st,
    paid: st === 'done' && !!r.paid, note: r.note || '', price: (st === 'done' && r.price != null) ? r.price : c.price, extra: !!r.extra };
}
function getSessions(fromD, toD){
  var out = [], f = dstr(fromD), t = dstr(toD);
  for (var d = new Date(fromD.getFullYear(), fromD.getMonth(), fromD.getDate()); dstr(d) <= t; d = addDays(d, 1)) {
    var ds = dstr(d), dow = d.getDay();
    for (var i = 0; i < S.classes.length; i++) {
      var c = S.classes[i], sl = c.slots && c.slots[dow];
      if (!sl) continue;
      if (c.from && ds < c.from) continue;
      var key = c.id + '|' + ds;
      out.push(build(key, c, ds, sl, S.sessions[key] || {}));
    }
  }
  Object.keys(S.sessions).forEach(function(k){
    var r = S.sessions[k];
    if (r.extra && r.date >= f && r.date <= t) {
      var c = clsById(r.classId);
      if (c) out.push(build(k, c, r.date, { start: r.start, end: r.end }, r));
    }
  });
  out.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.start < b.start ? -1 : a.start > b.start ? 1 : 0); });
  return out;
}
function daySessions(ds, cid){
  var d = pdate(ds);
  return getSessions(d, d).filter(function(s){ return !cid || s.cid === cid; });
}
function sessionFor(key){
  var r = S.sessions[key] || {};
  if (key.indexOf('x|') === 0) {
    var c0 = clsById(r.classId); if (!c0 || !r.extra) return null;
    return build(key, c0, r.date, { start: r.start, end: r.end }, r);
  }
  var p = key.split('|'), c = clsById(p[0]); if (!c) return null;
  var sl = c.slots && c.slots[pdate(p[1]).getDay()]; if (!sl) return null;
  return build(key, c, p[1], sl, r);
}
function defaultSlot(s){
  if (s.extra) return null;
  var c = clsById(s.cid); return c && c.slots[pdate(s.date).getDay()];
}
function setDone(s, on){
  var r = S.sessions[s.key] = S.sessions[s.key] || {};
  if (on) { r.status = 'done'; r.price = clsById(s.cid).price; r.start = s.start; r.end = s.end; }
  else { r.status = 'planned'; delete r.price; r.paid = false; }
}

/* ---------- UI state ---------- */
var tab = 'week';
var weekStart = mondayOf(new Date());
var payMonth = monthKey(new Date());
var calMode = 'week', calMonth = monthKey(new Date()), calClass = null;
var motion = 'fade', segJust = false, popKey = null, popDay = null, daySheet = null;

/* ---------- sheets ---------- */
function mountSheet(html){
  var prev = document.activeElement, ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab" aria-hidden="true"></div>' + html + '</div>';
  document.body.appendChild(ov);
  var sh = ov.firstChild, h2 = sh.querySelector('h2'), m = { ov: ov, close: close, onclose: null };
  if (h2) { h2.id = 'h' + uid(); sh.setAttribute('aria-labelledby', h2.id); }
  function isTop(){ var all = document.querySelectorAll('.ov:not(.out)'); return all[all.length - 1] === ov; }
  function onKey(e){
    if (!isTop()) return;
    if (e.key === 'Escape') return close();
    if (e.key !== 'Tab') return;
    var f = sh.querySelectorAll('button,input,select,textarea,a[href]'); if (!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (e.shiftKey && (a === first || a === sh)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  }
  function close(){
    if (ov.classList.contains('out')) return;
    ov.classList.add('out');
    document.removeEventListener('keydown', onKey);
    if (m.onclose) m.onclose();
    setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, RM ? 0 : 200);
    if (prev && prev.focus && document.body.contains(prev)) try { prev.focus({ preventScroll: true }); } catch(e){}
  }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
  try { sh.focus({ preventScroll: true }); } catch(e){}
  return m;
}
function openModal(o){
  var h = '<h2>' + esc(o.title) + '</h2>';
  (o.fields || []).forEach(function(f, i){
    var id = 'f' + i;
    if (f.type === 'checkbox') {
      h += '<div class="fld cb"><input type="checkbox" id="' + id + '"' + (f.value ? ' checked' : '') + '><label for="' + id + '">' + esc(f.label) + '</label></div>';
    } else if (f.type === 'select') {
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><select id="' + id + '">' + f.options.map(function(op){ return '<option value="' + esc(op.v) + '"' + (op.v === f.value ? ' selected' : '') + '>' + esc(op.l) + '</option>'; }).join('') + '</select></div>';
    } else if (f.type === 'textarea') {
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><textarea id="' + id + '"' + (f.mono ? ' class="mono" spellcheck="false"' : '') + '>' + esc(f.value || '') + '</textarea>' + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
    } else {
      var type = (f.type === 'time' || f.type === 'date') ? f.type : 'text';
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><input type="' + type + '" id="' + id + '" autocomplete="off" placeholder="' + esc(f.placeholder || '') + '" value="' + esc(f.value == null ? '' : f.value) + '">' + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
    }
  });
  h += '<div class="btns">';
  if (o.onDelete) h += '<button class="del" data-m="del">' + esc(o.deleteLabel || 'Xóa') + '</button>';
  h += '<button data-m="cancel">Đóng</button>';
  if (o.onSave) h += '<button class="save" data-m="save">' + esc(o.saveLabel || 'Lưu') + '</button>';
  h += '</div>';
  var m = mountSheet(h), ov = m.ov;
  function values(){
    return (o.fields || []).map(function(f, i){
      var el = ov.querySelector('#f' + i);
      return f.type === 'checkbox' ? el.checked : el.value;
    });
  }
  ov.addEventListener('click', function(e){
    var a = e.target.getAttribute && e.target.getAttribute('data-m');
    if (a === 'cancel') m.close();
    else if (a === 'save') { var r = o.onSave(values()); if (r !== false) m.close(); }
    else if (a === 'del') { ask(o.deleteMsg || 'Xóa mục này?', function(){ o.onDelete(); m.close(); }); }
  });
  return m;
}
function ask(msg, yes){ openModal({ title: msg, saveLabel: 'Đồng ý', fields: [], onSave: function(){ yes(); } }); }
var toastEl = null, toastT = null;
function toast(msg){
  if (toastEl && toastEl.parentNode) toastEl.parentNode.removeChild(toastEl);
  clearTimeout(toastT);
  var t = toastEl = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  toastT = setTimeout(function(){ t.classList.add('out'); setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 200); }, 2200);
}

/* ---------- day sheet (all sessions of one day) ---------- */
function openDay(ds, cid){
  var m = mountSheet('<h2>' + DOWF[pdate(ds).getDay()] + ' ' + dm(ds) + '</h2><div class="dlist"></div>' +
    '<div class="btns"><button data-m="cancel">Đóng</button><button class="save" data-act="add-extra" data-k="' + ds + '" data-c="' + (cid || '') + '">+ Thêm ca</button></div>');
  daySheet = { m: m, ds: ds, cid: cid };
  m.onclose = function(){ if (daySheet && daySheet.m === m) daySheet = null; };
  m.ov.addEventListener('click', function(e){ if (e.target.getAttribute && e.target.getAttribute('data-m') === 'cancel') m.close(); });
  fillDay();
}
function fillDay(){
  var list = daySessions(daySheet.ds, daySheet.cid);
  daySheet.m.ov.querySelector('.dlist').innerHTML = list.length ? list.map(sesCard).join('') : '<div class="none">Ngày này không có ca nào.</div>';
}

/* ---------- render ---------- */
function sesCard(s){
  var c = clsById(s.cid); if (!c) return '';
  var dur = durText(s.start, s.end);
  var h = '<div class="ses ' + s.status + '" style="--c:' + c.color + ';--ct:' + c.color + '22" role="button" tabindex="0" data-act="open-ses" data-k="' + esc(s.key) + '">';
  h += '<div class="mid"><div class="cn"><span class="nm">' + esc(c.name) + '</span>';
  if (s.status === 'done') h += '<span class="chip done">Đã dạy</span>';
  if (s.status === 'off') h += '<span class="chip off">Nghỉ</span>';
  if (s.extra) h += '<span class="chip off">Dạy bù</span>';
  h += '</div><div class="tm num">' + esc(s.start) + ' – ' + esc(s.end) + (dur ? ' · ' + dur : '') + ' · ' + fmt(s.price) + '</div>';
  if (s.note) h += '<div class="nt">📝 ' + esc(s.note) + '</div>';
  h += '</div>';
  if (s.status !== 'off') h += '<button class="tick' + (s.status === 'done' ? ' on' : '') + (s.key === popKey ? ' pop' : '') + '" data-act="tick" data-k="' + esc(s.key) + '" aria-pressed="' + (s.status === 'done') + '" aria-label="Đã dạy">✓</button>';
  h += '</div>';
  return h;
}
function emptyCard(msg){ return '<div class="card empty"><b>Chưa có lớp nào</b>' + msg + '<br><br><button class="ibtn primary" data-act="add-class">+ Thêm lớp</button></div>'; }
function calTop(){
  return '<div class="top"><h1>Lịch dạy</h1><div class="seg' + (calMode === 'month' ? ' r' : '') + (segJust ? ' just' : '') + '" role="group" aria-label="Chế độ xem">' +
    '<button data-act="cal-mode" data-t="week" aria-pressed="' + (calMode === 'week') + '">Tuần</button>' +
    '<button data-act="cal-mode" data-t="month" aria-pressed="' + (calMode === 'month') + '">Tháng</button></div>' +
    '<button class="ibtn primary" data-act="add-extra">+ Ca</button></div>';
}

function renderWeek(){
  if (calMode === 'month') return renderMonth();
  var end = addDays(weekStart, 6), ses = getSessions(weekStart, end), today = dstr(new Date());
  var plan = 0, done = 0, earn = 0;
  ses.forEach(function(s){ if (s.status !== 'off') plan++; if (s.status === 'done') { done++; earn += s.price; } });
  var thisWeek = dstr(weekStart) === dstr(mondayOf(new Date()));
  var h = calTop();
  h += '<div class="nav"><button class="ibtn" data-act="wk-prev" aria-label="Tuần trước">' + ICON.prev + '</button><div class="lb num">' +
    weekStart.getDate() + '/' + (weekStart.getMonth() + 1) + ' – ' + end.getDate() + '/' + (end.getMonth() + 1) + '/' + end.getFullYear() +
    '<small>' + (thisWeek ? 'Tuần này' : '<a href="#" data-act="wk-today">Về tuần này</a>') + '</small></div>' +
    '<button class="ibtn" data-act="wk-next" aria-label="Tuần sau">' + ICON.next + '</button></div>';
  if (!S.classes.length) return h + emptyCard('Thêm lớp đầu tiên với tiền mỗi buổi và lịch cố định hàng tuần.');
  h += '<div class="strip num"><span>Ca trong tuần <b>' + plan + '</b></span><span>Đã dạy <b>' + done + '</b></span><span>Lương tuần <b>' + fmt(earn) + '</b></span></div>';
  h += '<div class="prog" role="progressbar" aria-label="Tiến độ tuần" aria-valuemin="0" aria-valuemax="' + plan + '" aria-valuenow="' + done + '"><i data-bar="wk" style="--v:' + pct(done, plan) + '"></i></div>';

function monthStats(mk){
  var p = mk.split('-'), y = +p[0], m = +p[1];
  var from = new Date(y, m - 1, 1), to = new Date(y, m, 0);
  var ses = getSessions(from, to);
  var now = new Date(), today = dstr(now), nowT = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var per = {}, T = { earned: 0, collected: 0, projected: 0, done: 0, planned: 0, overdue: 0 };
  ses.forEach(function(s){
    var c = per[s.cid] || (per[s.cid] = { done: 0, planned: 0, off: 0, earned: 0, collected: 0, projected: 0 });
    if (s.status === 'done') { c.done++; c.earned += s.price; c.projected += s.price; if (s.paid) c.collected += s.price; }
    else if (s.status === 'planned') {
      c.planned++; c.projected += s.price;
      if (s.date < today || (s.date === today && s.end <= nowT)) T.overdue++;
    } else c.off++;
  });
  Object.keys(per).forEach(function(k){
    var c = per[k]; T.earned += c.earned; T.collected += c.collected; T.projected += c.projected; T.done += c.done; T.planned += c.planned + c.done;
  });
  return { per: per, T: T, ses: ses };
}

/* animate bars/rings and money values from their previous on-screen value */
function snap(){
  var m = { bar: {}, num: {} };
  each('#app [data-bar]', null, function(el){ m.bar[el.getAttribute('data-bar')] = el.style.getPropertyValue('--v'); });
  each('#app [data-count]', null, function(el){ m.num[el.getAttribute('data-count')] = +el.getAttribute('data-val'); });
  return m;
}
function play(m){
  if (RM) return;
  each('#app [data-bar]', null, function(el){
    var to = el.style.getPropertyValue('--v'), from = m.bar[el.getAttribute('data-bar')] || '0';
    if (from === to) return;
    el.style.setProperty('--v', from);
    getComputedStyle(el).getPropertyValue('--v');
    requestAnimationFrame(function(){ el.style.setProperty('--v', to); });
  });
  each('#app [data-count]', null, function(el){
    var to = +el.getAttribute('data-val'), key = el.getAttribute('data-count'), from = key in m.num ? m.num[key] : 0;
    if (from !== to) countUp(el, from, to);
  });
}
function countUp(el, from, to){
  var t0 = null;
  function step(ts){
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}

}

var actions = {
  'tab': function(d){ tab = d.t; calClass = null; go('fade', true); },
  'wk-prev': function(){ weekStart = addDays(weekStart, -7); go('right'); },
  'wk-next': function(){ weekStart = addDays(weekStart, 7); go('left'); },
  'wk-today': function(){ var t = mondayOf(new Date()); var m = weekStart > t ? 'right' : 'left'; weekStart = t; go(m); },
  'mo-prev': function(){ payMonth = shiftMonth(payMonth, -1); go('right'); },
  'mo-next': function(){ payMonth = shiftMonth(payMonth, 1); go('left'); },
  'cal-mode': function(d){
    if (d.t === calMode) return;
    if (d.t === 'month') calMonth = monthKey(addDays(weekStart, 3));
    else weekStart = calMonth === monthKey(new Date()) ? mondayOf(new Date()) : mondayOf(pdate(calMonth + '-01'));
    calMode = d.t; segJust = true; go('fade');
  },
  'cal-prev': function(){ calMonth = shiftMonth(calMonth, -1); go('right'); },
  'cal-next': function(){ calMonth = shiftMonth(calMonth, 1); go('left'); },
  'cal-today': function(){ var t = monthKey(new Date()); var m = calMonth > t ? 'right' : 'left'; calMonth = t; go(m); },
  'cal-day': function(d){
    if (!d.c) return openDay(d.k, '');
    var list = daySessions(d.k, d.c);
    if (list.length === 1) openSession(list[0].key);
    else if (list.length) openDay(d.k, d.c);
    else actions['add-extra'](d);
  },
  'cls-cal': function(d){ calClass = d.c; calMonth = d.k || monthKey(new Date()); tab = 'classes'; go('left', true); },
  'cls-back': function(){ calClass = null; go('right', true); },
  'tick': function(d){
    var s = sessionFor(d.k); if (!s) return;
    var on = s.status !== 'done';
    setDone(s, on);
    if (on) popKey = d.k;
    commit();
  },
  'open-ses': function(d){ openSession(d.k); },
  'add-extra': function(d){
    if (!S.classes.length) return toast('Hãy thêm lớp trước');
    var cid = d.c && clsById(d.c) ? d.c : S.classes[0].id, date = d.k || dstr(new Date());
    var sl = (clsById(cid).slots || {})[pdate(date).getDay()] || { start: DEF_START, end: DEF_END };
    openModal({ title: 'Thêm ca dạy bù / đột xuất', saveLabel: 'Thêm ca', fields: [
      { label: 'Lớp', type: 'select', value: cid, options: S.classes.map(function(c){ return { v: c.id, l: c.name }; }) },
      { label: 'Ngày', type: 'date', value: date },
      { label: 'Giờ bắt đầu', type: 'time', value: sl.start },
      { label: 'Giờ kết thúc', type: 'time', value: sl.end }],
      onSave: function(v){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v[1])) { toast('Chọn ngày'); return false; }
        if (!v[2] || !v[3] || mins(v[3]) <= mins(v[2])) { toast('Giờ kết thúc phải sau giờ bắt đầu'); return false; }
        S.sessions['x|' + uid()] = { extra: true, classId: v[0], date: v[1], start: v[2], end: v[3], status: 'planned' };
        if (tab === 'week' && calMode === 'week') weekStart = mondayOf(pdate(v[1])); else calMonth = v[1].slice(0, 7);
        commit(); toast('Đã thêm ca');
      } });
  },
  'add-class': function(){ openClassSheet(null); },
  'edit-class': function(d){ openClassSheet(d.c); },
  'backup': function(){
    var m = openModal({ title: 'Sao lưu / khôi phục', saveLabel: 'Khôi phục (thay dữ liệu hiện tại)', fields: [
      { label: 'Dữ liệu của bạn', type: 'textarea', mono: true, value: JSON.stringify(S), hint: 'Sao lưu: bấm "Tải file .json" hoặc chọn hết, sao chép rồi dán vào Ghi chú. Khôi phục: dán dữ liệu cũ vào đây rồi bấm nút bên dưới.' }],
      onSave: function(v){
        try {
          var d = JSON.parse(v[0]);
          if (!d || !Array.isArray(d.classes) || !d.sessions || typeof d.sessions !== 'object') throw 0;
          S = d; commit(); toast('Đã khôi phục');
        } catch(e){ toast('Dữ liệu không hợp lệ'); return false; }
      } });
    var dl = document.createElement('button');
    dl.textContent = 'Tải file .json';
    dl.addEventListener('click', exportJson);
    var btns = m.ov.querySelector('.btns'); btns.insertBefore(dl, btns.querySelector('.save'));
  },
  'theme': function(){
    var r = document.documentElement, cur = r.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  }
};

/* ---------- events ---------- */
var holdT = null, holdEl = null, held = false, hx = 0, hy = 0;
document.addEventListener('click', function(e){
  if (held) { held = false; return; } // swallow the click that ends a long-press
  var el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  var act = el.getAttribute('data-act');
  var d = { k: el.getAttribute('data-k'), c: el.getAttribute('data-c'), t: el.getAttribute('data-t') };
  if (actions[act]) actions[act](d);
});
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('div[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('pointerdown', function(e){
  held = false;
  var el = e.button === 0 && e.target.closest && e.target.closest('[data-hold]');
  if (!el) return;
  holdEl = el; hx = e.clientX; hy = e.clientY;
  el.classList.add('pressing');
  holdT = setTimeout(function(){
    holdT = null; held = true; el.classList.remove('pressing');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(_){}
    holdTick(el.getAttribute('data-k'), el.getAttribute('data-c'));
  }, 480);
});
function endHold(){
  if (holdT) { clearTimeout(holdT); holdT = null; }
  if (holdEl) { holdEl.classList.remove('pressing'); holdEl = null; }
  if (held) setTimeout(function(){ held = false; }, 80);
}
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
document.addEventListener('pointermove', function(e){ if (holdT && (Math.abs(e.clientX - hx) > 8 || Math.abs(e.clientY - hy) > 8)) endHold(); });
document.addEventListener('contextmenu', function(e){ if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault(); });
window.addEventListener('scroll', function(){ document.body.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

render();
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

</script>
