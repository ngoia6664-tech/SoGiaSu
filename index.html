<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sổ gia sư - Quản lý lịch dạy & học phí</title>
<meta name="theme-color" content="#0B0F19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ gia sư">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BẢN SẮC SỔ GIA SƯ: BẢNG ĐEN PHẤN DẠ QUANG & SỔ GIÁO ÁN ĐIỆN TỬ 3D
   ===================================================================== */
:root {
  --font-main: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
  --radius-card: 22px;
  --radius-pill: 9999px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);

  /* Bảng màu phấn dạ quang học đường */
  --chalk-white: #F8FAFC;
  --chalk-yellow: #FDE047;
  --chalk-cyan: #38BDF8;
  --chalk-green: #4ADE80;
  --chalk-pink: #F472B6;
  --stamp-red: #EF4444;
}

/* ==================== BẢNG ĐEN ĐÊM HỌC THUẬT (CHALKBOARD DARK) ==================== */
[data-theme="dark"] {
  --bg: #0B0F19;
  --bg-deep: #060910;
  --card: rgba(18, 25, 41, 0.82);
  --card-solid: #131A2C;
  --glass: rgba(18, 25, 41, 0.88);
  --edge: rgba(255, 255, 255, 0.1);
  --ink: #F1F5F9;
  --muted: #94A3B8;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(56, 189, 248, 0.35);
  --glow: rgba(56, 189, 248, 0.25);
  --brand: #38BDF8;
  --brand-2: #818CF8;
  --brand-soft: rgba(56, 189, 248, 0.15);
  --on-brand: #0B0F19;
  --ok: #4ADE80;
  --ok-soft: rgba(74, 222, 128, 0.18);
  --warn: #FDE047;
  --warn-soft: rgba(253, 224, 71, 0.18);
  --bad: #F43F5E;
  --bad-soft: rgba(244, 63, 94, 0.18);
  --sh1: 0 4px 20px rgba(0, 0, 0, 0.35);
  --sh2: 0 16px 36px rgba(0, 0, 0, 0.55);
}

/* ==================== TRANG VỞ SẠCH ĐẸP (CAMPUS LIGHT) ==================== */
[data-theme="light"], :root:not([data-theme="dark"]) {
  --bg: #F4F6FB;
  --bg-deep: #E8EDF8;
  --card: rgba(255, 255, 255, 0.92);
  --card-solid: #FFFFFF;
  --glass: rgba(255, 255, 255, 0.9);
  --edge: rgba(15, 23, 42, 0.08);
  --ink: #0F172A;
  --muted: #64748B;
  --line: rgba(15, 23, 42, 0.08);
  --line-strong: rgba(2, 132, 199, 0.35);
  --glow: rgba(2, 132, 199, 0.15);
  --brand: #0284C7;
  --brand-2: #38BDF8;
  --brand-soft: #E0F2FE;
  --on-brand: #FFFFFF;
  --ok: #16A34A;
  --ok-soft: #DCFCE7;
  --warn: #D97706;
  --warn-soft: #FEF3C7;
  --bad: #E11D48;
  --bad-soft: #FFE4E6;
  --sh1: 0 2px 12px rgba(15, 23, 42, 0.06);
  --sh2: 0 12px 28px rgba(15, 23, 42, 0.12);
}

@property --v { syntax: '<number>'; inherits: true; initial-value: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  background-color: var(--bg) !important;
  color: var(--ink) !important;
  font-family: var(--font-main);
  font-size: 15px;
  line-height: 1.45;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.4s ease, color 0.3s ease;
}
body { position: relative; overflow-x: hidden; }

/* CANVAS BỤI PHẤN RƠI NHẸ (CHALK DUST) */
#dustCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: -2;
  pointer-events: none;
}
#confettiCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
}

/* LƯỚI KẺ Ô TẬP VỞ HỌC SINH */
.chalkboard-texture {
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
  background-image: 
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 28px 28px;
  opacity: 0.6;
}

/* ĐƯỜNG CHỈ LỀ ĐỎ TẬP VỞ */
.margin-rule {
  position: fixed;
  top: 0;
  bottom: 0;
  left: max(12px, calc(50% - 290px));
  width: 2px;
  background: rgba(239, 68, 68, 0.28);
  z-index: -1;
  pointer-events: none;
}

.wrap { max-width: 580px; margin: 0 auto; padding: 0 16px 125px; }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; transition: transform .18s var(--ease), translate .2s var(--ease), background-color .2s ease, border-color .2s ease, box-shadow .25s ease, color .2s ease; }
button:active { transform: scale(.96); }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ==================== DYNAMIC RADAR ISLAND ==================== */
.class-radar-island {
  position: fixed;
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translate(-50%, -80px) scale(0.9);
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  background: var(--card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--line-strong);
  box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5), 0 0 20px var(--glow);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.4s var(--spring), opacity 0.3s;
  opacity: 0;
  pointer-events: none;
}
.class-radar-island.visible {
  transform: translate(-50%, 0) scale(1);
  opacity: 1;
  pointer-events: auto;
}
.class-radar-island .radar-live {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--chalk-green);
  box-shadow: 0 0 10px var(--chalk-green);
  animation: pulseDot 1.8s infinite;
}
@keyframes pulseDot {
  0% { transform: scale(0.9); opacity: 0.8; }
  50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 14px var(--chalk-green); }
  100% { transform: scale(0.9); opacity: 0.8; }
}
.class-radar-island .badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(56, 189, 248, 0.2);
  color: var(--chalk-cyan);
  font-weight: 700;
}

/* ==================== STICKY TOP HEADER ==================== */
.top {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 -16px 16px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(1.7) blur(18px);
  backdrop-filter: saturate(1.7) blur(18px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
body.scrolled .top { border-bottom-color: var(--line); }
.top h1 { font-size: 21px; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }

/* Đẩy nội dung ở các tab xuống bằng margin-top để không bị header che */
.top + * {
  margin-top: 14px !important;
}
.view > :not(.top):first-child {
  margin-top: 14px !important;
}

/* Buttons */
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--edge); background: var(--glass); border-radius: 14px; padding: 8px 14px; font-weight: 600; box-shadow: var(--sh1); }
.ibtn.primary { background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: var(--on-brand); border-color: transparent; box-shadow: 0 10px 20px -10px var(--brand), inset 0 1px 0 rgba(255,255,255,.35); flex: none; }
.ibtn.icon, .nav .ibtn { width: 42px; height: 42px; padding: 0; background: var(--brand-soft); color: var(--brand); border-color: transparent; box-shadow: none; flex: none; flex-shrink: 0; }
@media (hover:hover) {
  .ibtn:hover { translate: 0 -2px; border-color: var(--brand); box-shadow: 0 12px 22px -12px var(--brand); }
  .ibtn.primary:hover { filter: brightness(1.07) saturate(1.1); border-color: transparent; }
  .ibtn.icon:hover, .nav .ibtn:hover { background: var(--brand); color: var(--on-brand); border-color: transparent; }
}

/* ==================== BÌA SỔ GIÁO ÁN ĐIỆN TỬ 3D (ACADEMIC BINDER 3D) ==================== */
.binder-scene {
  perspective: 1200px;
  margin: 20px 0 18px;
}
.binder-card {
  position: relative;
  border-radius: var(--radius-card);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 22px 20px 18px;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 0.08s ease-out, box-shadow 0.3s;
  cursor: grab;
  overflow: hidden;
}
.binder-card.returning {
  transition: transform 0.5s var(--spring);
}

/* Kẹp ghim bướm kim loại 3D ở mép trên */
.binder-clip {
  position: absolute;
  top: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 24px;
  background: linear-gradient(180deg, #E2E8F0 0%, #94A3B8 50%, #475569 100%);
  border-radius: 6px;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4), inset 0 1px 1px #FFF;
  z-index: 10;
}
.binder-clip::before {
  content: "";
  position: absolute;
  top: 4px;
  left: 10px;
  right: 10px;
  height: 3px;
  background: #334155;
  border-radius: 2px;
}

/* Ánh gương phản quang di chuyển theo góc nghiêng */
.binder-glare {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 20%), rgba(255, 255, 255, 0.18), transparent 60%);
  pointer-events: none;
  opacity: var(--glare-opacity, 0.2);
  transition: opacity 0.3s;
}

.binder-inner {
  position: relative;
  z-index: 2;
}
.binder-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.tutor-title-tag {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--brand);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tutor-title-tag span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--chalk-yellow);
}

.binder-salary-box {
  margin-bottom: 14px;
}
.binder-lbl {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.binder-val {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: -0.03em;
  margin: 3px 0 8px;
  display: flex;
  align-items: baseline;
  gap: 4px;
}
/* Vệt highlight bút dạ quang vàng */
.highlight-stroke {
  position: relative;
  display: inline-block;
  z-index: 1;
}
.highlight-stroke::after {
  content: "";
  position: absolute;
  bottom: 2px;
  left: -4px;
  right: -4px;
  height: 12px;
  background: rgba(253, 224, 71, 0.4);
  border-radius: 4px;
  z-index: -1;
  transform: rotate(-0.5deg);
}

.binder-progress-wrap {
  width: 100%;
}
.binder-progress-bar {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  overflow: hidden;
}
.binder-progress-fill {
  height: 100%;
  width: var(--binder-prog, 65%);
  background: linear-gradient(90deg, var(--chalk-cyan), var(--chalk-green));
  border-radius: 6px;
  transition: width 0.8s var(--ease);
}

.binder-bottom-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  font-size: 13px;
}
.binder-bottom-stats b {
  font-size: 14.5px;
  display: block;
  margin-top: 2px;
}

/* ==================== SEGMENTED CONTROL ==================== */
.seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; background: color-mix(in srgb, var(--ink) 7%, transparent); border-radius: 14px; padding: 3px; flex: none; }
.seg::before { content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: linear-gradient(135deg, var(--brand-2), var(--brand)); border-radius: 11px; box-shadow: 0 6px 14px -6px var(--brand); }
.seg.r::before { transform: translateX(100%); }
.seg.just.r::before { animation: segR .35s var(--spring); }
.seg.just:not(.r)::before { animation: segL .35s var(--spring); }
@keyframes segR { from { transform: translateX(0); } }
@keyframes segL { from { transform: translateX(100%); } }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 13px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-radius: 11px; transition: color .25s ease; }
.seg button[aria-pressed="true"] { color: var(--on-brand); }

.nav { display: flex; align-items: center; gap: 8px; margin-top: 14px; margin-bottom: 12px; }
.nav .lb { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 16px; }
.nav .lb small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.nav .lb a { color: var(--brand); text-decoration: none; font-weight: 600; }
.strip { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); justify-content: center; margin-bottom: 4px; }
.strip b { color: var(--ink); font-weight: 700; }
.prog { height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; margin: 8px 0 2px; }
.prog i { display: block; height: 100%; width: calc(var(--v)*1%); border-radius: inherit; background: var(--bc, linear-gradient(90deg, var(--ok), #34D399)); transition: --v .7s var(--ease); }
.prog.sm { flex: 1; min-width: 28px; max-width: 90px; height: 5px; margin: 0; }

.day { margin-top: 18px; }
.dh { display: flex; align-items: center; gap: 8px; padding: 0 2px; }
.dh b { font-size: 15px; }
.dh span.d { color: var(--muted); font-size: 13px; }
.tag { font-size: 11.5px; padding: 2px 9px; border-radius: 20px; background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: var(--on-brand); font-weight: 700; }
.day.today .dh b { color: var(--brand); }
.none { color: var(--muted); font-size: 13px; padding: 6px 2px 0; }

/* ==================== CA DẠY (SESSION CARDS) ==================== */
.ses {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--edge);
  border-left: 5px solid var(--c);
  border-radius: 18px;
  padding: 12px 14px;
  margin-top: 9px;
  cursor: pointer;
  box-shadow: var(--sh1);
  transition: translate .25s var(--ease), box-shadow .25s ease;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
@media (hover:hover) {
  .ses:hover { translate: 0 -2px; box-shadow: var(--sh2); border-color: var(--c); }
}
.ses .mid { flex: 1; min-width: 0; }
.ses .cn { font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ses .tm { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ses .nt { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ses.off { opacity: .55; }
.ses.off .cn span.nm { text-decoration: line-through; }
.chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.off { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--muted); }

/* ==================== TICK Ở LỊCH (TRẢ VỀ CODE CŨ) ==================== */
.tick {
  position: relative;
  flex: none;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 2.5px solid var(--c);
  background: var(--glass);
  display: grid;
  place-items: center;
  color: transparent;
  font-size: 18px;
  font-weight: 800;
  transition: transform .18s var(--spring), background-color .2s ease, box-shadow .25s ease;
}
.tick.on {
  background: var(--c);
  color: #fff;
  box-shadow: 0 8px 16px -6px var(--c);
}
@media (hover:hover) {
  .tick:hover { transform: scale(1.1); box-shadow: 0 8px 16px -8px var(--c); }
}
.tick.pop { animation: pop .4s var(--spring); }
.tick.pop::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--c); animation: burst .55s ease-out forwards; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes burst { to { transform: scale(1.8); opacity: 0; } }

/* ==================== 1 NÚT DUY NHẤT Ở TAB LƯƠNG: ĐÃ TRẢ / CHƯA TRẢ ==================== */
.pay-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 800;
  padding: 5px 13px;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s var(--spring);
}
.pay-toggle-btn.paid {
  background: var(--ok-soft);
  color: var(--ok);
  border: 1.5px solid var(--ok);
  box-shadow: 0 4px 12px -4px rgba(74, 222, 128, 0.4);
}
.pay-toggle-btn.paid:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}
.pay-toggle-btn.unpaid {
  background: var(--warn-soft);
  color: var(--warn);
  border: 1.5px solid var(--warn);
  box-shadow: 0 4px 12px -4px rgba(253, 224, 71, 0.4);
}
.pay-toggle-btn.unpaid:hover {
  transform: scale(1.05);
  filter: brightness(1.1);
}

/* ==================== CARDS & BENTO ==================== */
.card {
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: 20px;
  padding: 16px;
  margin-top: 11px;
  box-shadow: var(--sh1);
  transition: translate .25s var(--ease), box-shadow .25s ease;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.card.ccard { display: flex; align-items: center; gap: 8px; padding: 14px; }
.crow { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; }
button.crow { cursor: pointer; }
.dotc { flex: none; width: 14px; height: 46px; border-radius: 7px; box-shadow: 0 8px 14px -8px currentColor; }
.crow .mid { flex: 1; min-width: 0; }
.crow .nm { display: block; font-weight: 800; font-size: 15.5px; }
.crow .sb { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.crow .pr { font-weight: 800; text-align: right; white-space: nowrap; font-size: 16px; }
.cm { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
.empty { text-align: center; padding: 28px 14px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ==================== PHẦN LƯƠNG: ĐÃ TRẢ & CHƯA TRẢ CHO MỖI LỚP ==================== */
.pay-breakdown-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.pay-badge-paid {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--ok-soft);
  color: var(--ok);
  border: 1px solid rgba(74, 222, 128, 0.25);
}
.pay-badge-unpaid {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--warn-soft);
  color: var(--warn);
  border: 1px solid rgba(253, 224, 71, 0.3);
}


.sum {
  --paid: #4ADE80;
  --unpaid: var(--chalk-yellow);

  });
  out.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.start < b.start ? -1 : a.start > b.start ? 1 : 0); });
  return out;
}

function daySessions(ds, cid){
  var d = pdate(ds);
  return getSessions(d, d).filter(function(s){ return !cid || s.cid === cid; });

function sessionFor(key){
  var r = S.sessions[key] || {};
  if (key.indexOf('x|') === 0) {
    var c0 = clsById(r.classId); if (!c0 || !r.extra) return null;
    return build(key, c0, r.date, { start: r.start, end: r.end }, r);
  }
  var p = key.split('|'), c = clsById(p[0]); if (!c) return null;
  var sl = c.slots && c.slots[pdate(p[1]).getDay()]; if (!sl) return null;
  return build(key, c, p[1], sl, r);
}

function defaultSlot(s){
  if (s.extra) return null;
  var c = clsById(s.cid); return c && c.slots[pdate(s.date).getDay()];
}

function setDone(s, on){
  var r = S.sessions[s.key] = S.sessions[s.key] || {};
  if (on) {
    r.status = 'done';
    r.price = clsById(s.cid).price;
    r.start = s.start;
    r.end = s.end;
  } else {
    r.status = 'planned';
    delete r.price;
    r.paid = false;
  }
}

/* ---------- Sheets & Modals ---------- */
function mountSheet(html){
  var prev = document.activeElement, ov = document.createElement('div');
  ov.className = 'ov';
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" tabindex="-1"><div class="grab" aria-hidden="true"></div>' + html + '</div>';
  document.body.appendChild(ov);
  var sh = ov.firstChild, h2 = sh.querySelector('h2'), m = { ov: ov, close: close, onclose: null };
  if (h2) { h2.id = 'h' + uid(); sh.setAttribute('aria-labelledby', h2.id); }
  function isTop(){ var all = document.querySelectorAll('.ov:not(.out)'); return all[all.length - 1] === ov; }
  function onKey(e){
    if (!isTop()) return;
    if (e.key === 'Escape') return close();
    if (e.key !== 'Tab') return;
    var f = sh.querySelectorAll('button,input,select,textarea,a[href]'); if (!f.length) return;
    var first = f[0], last = f[f.length - 1], a = document.activeElement;
    if (e.shiftKey && (a === first || a === sh)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
  }
  function close(){
    if (ov.classList.contains('out')) return;
    ov.classList.add('out');
    document.removeEventListener('keydown', onKey);
    if (m.onclose) m.onclose();
    setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, RM ? 0 : 200);
    if (prev && prev.focus && document.body.contains(prev)) try { prev.focus({ preventScroll: true }); } catch(e){}
  }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', function(e){ if (e.target === ov) close(); });
  try { sh.focus({ preventScroll: true }); } catch(e){}
  return m;
}

function openModal(o){
  var h = '<h2>' + esc(o.title) + '</h2>';
  (o.fields || []).forEach(function(f, i){
    var id = 'f' + i;
    if (f.type === 'checkbox') {
      h += '<div class="fld cb"><input type="checkbox" id="' + id + '"' + (f.value ? ' checked' : '') + '><label for="' + id + '">' + esc(f.label) + '</label></div>';
    } else if (f.type === 'select') {
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><select id="' + id + '">' + f.options.map(function(op){ return '<option value="' + esc(op.v) + '"' + (op.v === f.value ? ' selected' : '') + '>' + esc(op.l) + '</option>'; }).join('') + '</select></div>';
    } else if (f.type === 'textarea') {
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><textarea id="' + id + '"' + (f.mono ? ' class="mono" spellcheck="false"' : '') + '>' + esc(f.value || '') + '</textarea>' + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
    } else {
      var type = (f.type === 'time' || f.type === 'date') ? f.type : 'text';
      h += '<div class="fld"><label for="' + id + '">' + esc(f.label) + '</label><input type="' + type + '" id="' + id + '" autocomplete="off" placeholder="' + esc(f.placeholder || '') + '" value="' + esc(f.value == null ? '' : f.value) + '">' + (f.hint ? '<div class="hint">' + esc(f.hint) + '</div>' : '') + '</div>';
    }
  });
  h += '<div class="btns">';
  if (o.onDelete) h += '<button class="del" data-m="del">' + esc(o.deleteLabel || 'Xóa') + '</button>';
  h += '<button data-m="cancel">Đóng</button>';
  if (o.onSave) h += '<button class="save" data-m="save">' + esc(o.saveLabel || 'Lưu') + '</button>';
  h += '</div>';
  var m = mountSheet(h), ov = m.ov;
  function values(){
    return (o.fields || []).map(function(f, i){
      var el = ov.querySelector('#f' + i);
      return f.type === 'checkbox' ? el.checked : el.value;
    });
  }
  ov.addEventListener('click', function(e){
    var a = e.target.getAttribute && e.target.getAttribute('data-m');
    if (a === 'cancel') m.close();
    else if (a === 'save') { var r = o.onSave(values()); if (r !== false) m.close(); }
    else if (a === 'del') { ask(o.deleteMsg || 'Xóa mục này?', function(){ o.onDelete(); m.close(); }); }
  });
  return m;
}

/* ==================== MONTH STATS (THỐNG KÊ CHI TIẾT ĐÃ TRẢ & CHƯA TRẢ) ==================== */
function isClassPaidInMonth(cid, mk, per){
  var key = cid + '|' + mk;
  if (S.paidMonths && S.paidMonths[key] !== undefined) return S.paidMonths[key];
  var x = per && per[cid];
  if (x && x.done > 0) return x.unpaidCount === 0;
  return false;
}

function monthStats(mk){
  var p = mk.split('-'), y = +p[0], m = +p[1];
  var from = new Date(y, m - 1, 1), to = new Date(y, m, 0);
  var ses = getSessions(from, to);
  var now = new Date(), today = dstr(now), nowT = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var per = {}, T = { earned: 0, collected: 0, projected: 0, done: 0, planned: 0, overdue: 0, paidCount: 0, unpaidCount: 0, unpaidAmount: 0 };
  
  ses.forEach(function(s){
    var c = per[s.cid] || (per[s.cid] = {
      done: 0,
      planned: 0,
      off: 0,
      earned: 0,
      collected: 0,
      projected: 0,
      paidCount: 0,
      unpaidCount: 0,
      unpaidAmount: 0
    });
    
    if (s.status === 'done') {
      c.done++;
      c.earned += s.price;
      c.projected += s.price;
      if (s.paid) {
        c.collected += s.price;
        c.paidCount++;
      } else {
        c.unpaidCount++;
        c.unpaidAmount += s.price;
      }
    } else if (s.status === 'planned') {
      c.planned++;
      c.projected += s.price;
      if (s.date < today || (s.date === today && s.end <= nowT)) T.overdue++;
    } else {
      c.off++;
    }
  });

  Object.keys(per).forEach(function(k){
    var c = per[k];
    var isPaid = isClassPaidInMonth(k, mk, per);
    if (isPaid) {
      c.collected = c.earned;
      c.unpaidAmount = 0;
      c.paidCount = c.done;
      c.unpaidCount = 0;
    } else {
      c.collected = 0;
      c.unpaidAmount = c.earned;
      c.paidCount = 0;
      c.unpaidCount = c.done;
    }

    T.earned += c.earned;
    T.collected += c.collected;
    T.projected += c.projected;
    T.done += c.done;
    T.planned += c.planned + c.done;
    T.paidCount += c.paidCount;
    T.unpaidCount += c.unpaidCount;
    T.unpaidAmount += c.unpaidAmount;
  });

  return { per: per, T: T, ses: ses };
}

/* Animate bars and count-up values */
function snap(){
  var m = { bar: {}, num: {} };
  each('#app [data-bar]', null, function(el){ m.bar[el.getAttribute('data-bar')] = el.style.getPropertyValue('--v'); });
  each('#app [data-count]', null, function(el){ m.num[el.getAttribute('data-count')] = +el.getAttribute('data-val'); });
  return m;
}
function play(m){
  if (RM) return;
  each('#app [data-bar]', null, function(el){
    var to = el.style.getPropertyValue('--v'), from = m.bar[el.getAttribute('data-bar')] || '0';
    if (from === to) return;
    el.style.setProperty('--v', from);
    getComputedStyle(el).getPropertyValue('--v');
    requestAnimationFrame(function(){ el.style.setProperty('--v', to); });
  });
  each('#app [data-count]', null, function(el){
    var to = +el.getAttribute('data-val'), key = el.getAttribute('data-count'), from = key in m.num ? m.num[key] : 0;
    if (from !== to) countUp(el, from, to);
  });
}
function countUp(el, from, to){
  var t0 = null;
  function step(ts){
    if (t0 === null) t0 = ts;
    var k = Math.min(1, (ts - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1 && el.isConnected) requestAnimationFrame(step); else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}

    '<div class="btns">' + (ex ? '<button class="del" data-m="del">Xóa lớp</button>' : '') + '<button data-m="cancel">Đóng</button><button class="save" data-m="save">Lưu</button></div>');
  var ov = m.ov;
  function slots(){
    var box = ov.querySelector('#slotbox');
    box.innerHTML = '<div class="days">' + ORDER.map(function(d){ return '<button type="button" class="dchip' + (draft.slots[d] ? ' on' : '') + '" data-d="' + d + '">' + DOWN[d] + '</button>'; }).join('') + '</div>' +
      ORDER.filter(function(d){ return draft.slots[d]; }).map(function(d){
        return '<div class="trow"><span class="dn">' + DOWF[d] + '</span><input type="time" data-d="' + d + '" data-w="start" value="' + draft.slots[d].start + '"><span>–</span><input type="time" data-d="' + d + '" data-w="end" value="' + draft.slots[d].end + '"></div>';
      }).join('');
  }
  slots();
  ov.addEventListener('change', function(e){
    var d = e.target.getAttribute('data-d'), w = e.target.getAttribute('data-w');
    if (d !== null && w && draft.slots[d]) draft.slots[d][w] = e.target.value;
  });
  ov.addEventListener('click', function(e){
    var t = e.target;
    if (!t.getAttribute) return;
    var col = t.getAttribute('data-col');
    if (col) { draft.color = col; each('#sw button', ov, function(b){ b.classList.toggle('sel', b.getAttribute('data-col') === col); }); return; }
    var dd = t.getAttribute('data-d');
    if (dd !== null && t.classList.contains('dchip')) {
      if (draft.slots[dd]) delete draft.slots[dd];
      else {
        var last = null; ORDER.forEach(function(x){ if (draft.slots[x]) last = draft.slots[x]; });
        draft.slots[dd] = { start: last ? last.start : DEF_START, end: last ? last.end : DEF_END };
      }
      slots(); return;
    }
    var a = t.getAttribute('data-m');
    if (a === 'cancel') m.close();
    else if (a === 'del') {
      ask('Xóa lớp "' + draft.name + '" và toàn bộ lịch sử các buổi dạy của lớp?', function(){

        Object.keys(S.sessions).forEach(function(k){ var r = S.sessions[k]; if (k.indexOf(draft.id + '|') === 0 || r.classId === draft.id) delete S.sessions[k]; });
        commit(); m.close();
      });
    } else if (a === 'save') {
      var name = ov.querySelector('#cn').value.trim();
      if (!name) return toast('Nhập tên lớp');
      var price = parseMoney(ov.querySelector('#cp').value);
      if (isNaN(price) || price < 0) return toast('Tiền mỗi buổi chưa hợp lệ. Ví dụ: 200k');
      var from = ov.querySelector('#cf').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(from)) return toast('Chọn ngày bắt đầu');
      var bad = Object.keys(draft.slots).some(function(d){ var s = draft.slots[d]; return !s.start || !s.end || mins(s.end) <= mins(s.start); });
      if (bad) return toast('Giờ kết thúc phải sau giờ bắt đầu');
      draft.name = name; draft.price = price; draft.from = from;
      var i = S.classes.map(function(c){ return c.id; }).indexOf(draft.id);
      if (i >= 0) S.classes[i] = draft; else S.classes.push(draft);
      commit(); m.close();
    }
  });
  if (!ex) setTimeout(function(){ var n = ov.querySelector('#cn'); if (n) n.focus(); }, 60);
}

function openSession(key){
  var s = sessionFor(key); if (!s) return;
  var c = clsById(s.cid);
  var d = pdate(s.date);
  openModal({
    title: c.name + ' · ' + DOWF[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1),
    fields: [
      { label: 'Trạng thái buổi dạy', type: 'select', value: s.status, options: [{ v: 'planned', l: 'Sắp dạy' }, { v: 'done', l: 'Đã dạy' }, { v: 'off', l: 'Nghỉ buổi này' }] },
      { label: 'Giờ bắt đầu', type: 'time', value: s.start },
      { label: 'Giờ kết thúc', type: 'time', value: s.end },
      { label: 'Nội dung buổi dạy / bài tập', type: 'textarea', value: s.note },
      { label: 'Phụ huynh đã trả tiền (Đã thanh toán buổi này)', type: 'checkbox', value: s.paid }
    ],
    onSave: function(v){
      if (!v[1] || !v[2] || mins(v[2]) <= mins(v[1])) { toast('Giờ kết thúc phải sau giờ bắt đầu'); return false; }
      var r = S.sessions[key] = S.sessions[key] || {};
      var def = defaultSlot(s);
      r.status = v[0];
      if (v[0] === 'done') {
        if (s.status !== 'done' || r.price == null) r.price = c.price;
        r.paid = !!v[4];
      } else {
        delete r.price;
        r.paid = false;
      }
      if (v[0] === 'done' || s.extra || !def || v[1] !== def.start || v[2] !== def.end) { r.start = v[1]; r.end = v[2]; }
      else { delete r.start; delete r.end; }
      r.note = v[3].trim();
      commit();
      toast('Đã cập nhật buổi dạy');
    },
    onDelete: s.extra ? function(){ delete S.sessions[key]; commit(); } : null,
    deleteLabel: 'Xóa ca',
    deleteMsg: 'Xóa ca dạy bù này?'
  });
}

function exportJson(){
  var name = 'so-gia-su-' + dstr(new Date()) + '.json', text = JSON.stringify(S, null, 2);

    var f = new File([text], name, { type: 'application/json' });

      navigator.share({ files: [f] }).catch(function(){});
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('Đã tải ' + name);
  } catch(e){ toast('Không tải được file, hãy sao chép dữ liệu trong ô'); }
}

function holdTick(ds, cid){

  list.forEach(function(s){ if ((s.status === 'done') !== on) setDone(s, on); });

  'backup': function(){
    var m = openModal({ title: 'Sao lưu / khôi phục', saveLabel: 'Khôi phục (thay dữ liệu hiện tại)', fields: [
      { label: 'Dữ liệu của bạn', type: 'textarea', mono: true, value: JSON.stringify(S), hint: 'Sao lưu: bấm "Tải file .json" hoặc chọn hết, sao chép rồi dán vào Ghi chú. Khôi phục: dán dữ liệu cũ vào đây rồi bấm nút bên dưới.' }],
      onSave: function(v){
        try {
          var d = JSON.parse(v[0]);
          if (!d || !Array.isArray(d.classes) || !d.sessions || typeof d.sessions !== 'object') throw 0;
          S = d; commit(); toast('Đã khôi phục thành công');
        } catch(e){ toast('Dữ liệu không hợp lệ'); return false; }
      } });
    var dl = document.createElement('button');
    dl.textContent = 'Tải file .json';
    dl.addEventListener('click', exportJson);
    var btns = m.ov.querySelector('.btns'); btns.insertBefore(dl, btns.querySelector('.save'));
  },
  'theme': function(){
    var r = document.documentElement, cur = r.getAttribute('data-theme');
    var isDark = cur === 'dark';
    r.setAttribute('data-theme', isDark ? 'light' : 'dark');
    toast(isDark ? 'Đã đổi sang: Trang Vở Sáng' : 'Đã đổi sang: Bảng Đen Học Thuật');
  }
};

/* ---------- Events & Listeners ---------- */
var holdT = null, holdEl = null, held = false, hx = 0, hy = 0;
document.addEventListener('click', function(e){
  if (held) { held = false; return; }
  var el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  var act = el.getAttribute('data-act');
  var d = { k: el.getAttribute('data-k'), c: el.getAttribute('data-c'), t: el.getAttribute('data-t') };
  if (actions[act]) actions[act](d, e);
});

document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('div[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});

document.addEventListener('pointerdown', function(e){
  held = false;
  var el = e.button === 0 && e.target.closest && e.target.closest('[data-hold]');
  if (!el) return;
  holdEl = el; hx = e.clientX; hy = e.clientY;
  el.classList.add('pressing');
  holdT = setTimeout(function(){
    holdT = null; held = true; el.classList.remove('pressing');
    try { if (navigator.vibrate) navigator.vibrate(12); } catch(_){}
    holdTick(el.getAttribute('data-k'), el.getAttribute('data-c'));
  }, 480);
});

function endHold(){
  if (holdT) { clearTimeout(holdT); holdT = null; }
  if (holdEl) { holdEl.classList.remove('pressing'); holdEl = null; }
  if (held) setTimeout(function(){ held = false; }, 80);
}
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
document.addEventListener('pointermove', function(e){ if (holdT && (Math.abs(e.clientX - hx) > 8 || Math.abs(e.clientY - hy) > 8)) endHold(); });
document.addEventListener('contextmenu', function(e){ if (e.target.closest && e.target.closest('[data-hold]')) e.preventDefault(); });

window.addEventListener('scroll', function(){
  document.body.classList.toggle('scrolled', window.scrollY > 4);
  updateRadarVisibility();
}, { passive: true });

/* ==================== BÌA SỔ GIÁO ÁN 3D PARALLAX TILT ==================== */
function initBinderTilt(){
  var card = document.getElementById('binderCard');
  var glare = document.getElementById('binderGlare');
  if (!card) return;

  function applyTilt(x, y, w, h){
    card.classList.remove('returning');
    var px = (x / w) * 2 - 1, py = (y / h) * 2 - 1;
    card.style.setProperty('--rx', (-py * 12).toFixed(2) + 'deg');
    card.style.setProperty('--ry', (px * 12).toFixed(2) + 'deg');
    if (glare) {
      glare.style.setProperty('--glare-x', ((x / w) * 100).toFixed(1) + '%');
      glare.style.setProperty('--glare-y', ((y / h) * 100).toFixed(1) + '%');
      glare.style.setProperty('--glare-opacity', '0.45');
    }
  }

  function resetTilt(){
    card.classList.add('returning');
    card.style.setProperty('--rx', '0deg');
    card.style.setProperty('--ry', '0deg');
    if (glare) glare.style.setProperty('--glare-opacity', '0.2');
  }

  card.onmousemove = function(e){
    var rect = card.getBoundingClientRect();
    applyTilt(e.clientX - rect.left, e.clientY - rect.top, rect.width, rect.height);
  };
  card.onmouseleave = resetTilt;

  card.ontouchstart = function(e){
    var touch = e.touches[0], rect = card.getBoundingClientRect();
    applyTilt(touch.clientX - rect.left, touch.clientY - rect.top, rect.width, rect.height);
  };
  card.ontouchmove = function(e){
    var touch = e.touches[0], rect = card.getBoundingClientRect();
    applyTilt(touch.clientX - rect.left, touch.clientY - rect.top, rect.width, rect.height);
  };
  card.ontouchend = resetTilt;
}

/* ==================== CLASS RADAR ISLAND (ĐẾM NGƯỢC CA DẠY) ==================== */
function updateRadarIsland(){
  var island = document.getElementById('radarIsland');
  var textEl = document.getElementById('radarText');
  var badgeEl = document.getElementById('radarBadge');
  if (!island || !textEl) return;

  var today = new Date();
  var ses = getSessions(today, today).filter(function(s){ return s.status !== 'off'; });
  var nowM = today.getHours() * 60 + today.getMinutes();
  var nextSes = null, minDiff = Infinity;

  ses.forEach(function(s){
    var startM = mins(s.start);
    var diff = startM - nowM;
    if (diff >= -30 && diff < minDiff) {
      minDiff = diff;
      nextSes = s;
    }
  });

  if (nextSes) {
    var c = clsById(nextSes.cid);
    var timeDesc = minDiff > 0 ? ('Còn ' + minDiff + 'p') : (nextSes.status === 'done' ? '✓ Đã dạy' : 'Đang trong giờ');
    textEl.innerHTML = 'Ca tiếp: <b>' + esc(c ? c.name : 'Lớp') + ' (' + esc(nextSes.start) + ')</b>';
    badgeEl.textContent = timeDesc + ' ↑';
  } else {
    textEl.innerHTML = 'Hôm nay: <b>Đã hoàn thành ca dạy</b>';
    badgeEl.textContent = 'Nghỉ ngơi ↑';
  }
}

function updateRadarVisibility(){
  var island = document.getElementById('radarIsland');
  if (island) {
    island.classList.toggle('visible', window.scrollY > 160);
  }
}

/* ==================== CHALK DUST PARTICLES (BỤI PHẤN 60FPS) ==================== */
var dustCanvas = document.getElementById('dustCanvas');
var dCtx = dustCanvas.getContext('2d');
var dParticles = [];

function resizeDust(){
  dustCanvas.width = window.innerWidth;
  dustCanvas.height = window.innerHeight;
  initDust();
}
function initDust(){
  dParticles = [];
  var count = Math.min(Math.floor(window.innerWidth / 30), 30);
  for (var i = 0; i < count; i++) {
    dParticles.push({
      x: Math.random() * dustCanvas.width,
      y: Math.random() * dustCanvas.height,
      radius: Math.random() * 1.6 + 0.6,
      vx: (Math.random() - 0.5) * 0.25,
      vy: Math.random() * 0.35 + 0.1,
      alpha: Math.random() * 0.35 + 0.15
    });
  }
}
window.addEventListener('resize', resizeDust);
resizeDust();

function drawDust(){
  dCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var rgb = isDark ? '248, 250, 252' : '15, 23, 42';

  for (var i = 0; i < dParticles.length; i++) {
    var p = dParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    if (p.y > dustCanvas.height) { p.y = 0; p.x = Math.random() * dustCanvas.width; }
    if (p.x < 0) p.x = dustCanvas.width;
    if (p.x > dustCanvas.width) p.x = 0;

    dCtx.beginPath();
    dCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    dCtx.fillStyle = 'rgba(' + rgb + ', ' + p.alpha + ')';
    dCtx.fill();
  }
  requestAnimationFrame(drawDust);
}
requestAnimationFrame(drawDust);

/* ==================== STAMP BURST CONFETTI ==================== */
var confettiCanvas = document.getElementById('confettiCanvas');
var cCtx = confettiCanvas.getContext('2d');
var stampParticles = [];
var stampAnimating = false;

function resizeConfetti(){
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function createStampBurst(x, y){
  var colors = ['#FDE047', '#38BDF8', '#4ADE80', '#F472B6', '#FFFFFF'];
  for (var i = 0; i < 28; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 7 + 2;
    stampParticles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: Math.random() * 4.5 + 2.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      opacity: 1,
      decay: Math.random() * 0.025 + 0.015
    });
  }
  if (!stampAnimating) {
    stampAnimating = true;
    requestAnimationFrame(renderStampBurst);
  }
}

function renderStampBurst(){
  cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  for (var i = stampParticles.length - 1; i >= 0; i--) {
    var p = stampParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.22;
    p.opacity -= p.decay;

    if (p.opacity <= 0) { stampParticles.splice(i, 1); continue; }

    cCtx.beginPath();
    cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    cCtx.fillStyle = p.color;
    cCtx.globalAlpha = p.opacity;
    cCtx.fill();
  }
  if (stampParticles.length > 0) requestAnimationFrame(renderStampBurst);
  else stampAnimating = false;
}

render();
})();

  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
